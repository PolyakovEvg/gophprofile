{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gophprofile.secretName" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secret.databaseURL | quote }}
  RABBITMQ_URL: {{ .Values.secret.rabbitmqURL | quote }}
  S3_ACCESS_KEY: {{ .Values.secret.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secret.s3SecretKey | quote }}
{{- end }}
