{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gophprofile.fullname" . }}-{{ .Values.server.name }}
  labels:
    {{- include "gophprofile.componentLabels" (dict "component" .Values.server.name "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gophprofile.selectorLabels" (dict "component" .Values.server.name "Release" .Release "Chart" .Chart) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress controller -> API traffic.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceLabel | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.server.containerPort }}
    # Prometheus (Prometheus Operator) -> /metrics scraping.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.monitoringNamespaceLabel | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.server.containerPort }}
  egress:
    # DNS resolution.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL: same-namespace pod when bundled, otherwise an external/
    # managed instance reachable only on the DB port.
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "gophprofile.selectorLabels" (dict "component" "postgres" "Release" .Release "Chart" .Chart) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    {{- else }}
    - ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    # RabbitMQ.
    {{- if .Values.rabbitmq.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "gophprofile.selectorLabels" (dict "component" "rabbitmq" "Release" .Release "Chart" .Chart) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5672
    {{- else }}
    - ports:
        - protocol: TCP
          port: 5672
    {{- end }}
    # S3-compatible object storage.
    {{- if .Values.minio.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "gophprofile.selectorLabels" (dict "component" "minio" "Release" .Release "Chart" .Chart) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9000
    {{- else }}
    - ports:
        - protocol: TCP
          port: 443
    {{- end }}
    # Optional OTLP trace export.
    - ports:
        - protocol: TCP
          port: 4317
{{- end }}
