apiVersion: v1
kind: Service
metadata:
  name: {{ include "gophprofile.fullname" . }}-{{ .Values.server.name }}
  labels:
    {{- include "gophprofile.componentLabels" (dict "component" .Values.server.name "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "gophprofile.selectorLabels" (dict "component" .Values.server.name "Release" .Release "Chart" .Chart) | nindent 4 }}
  ports:
    # The API and /metrics are served on the same port; the ServiceMonitor
    # targets this "http" port name directly.
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
