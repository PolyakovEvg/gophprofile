{{/* Restrict the bundled dev infra pods to only accept traffic from the
     app pods and hook Jobs that need them, instead of any pod in the
     namespace. Only meaningful for the chart's own bundled Postgres/
     RabbitMQ/MinIO (dev/local); it is skipped for external/managed
     services, which are not Kubernetes pods this policy can select. */}}
{{- if .Values.networkPolicy.enabled }}
{{- if .Values.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gophprofile.fullname" . }}-postgres
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gophprofile.selectorLabels" (dict "component" "postgres" "Release" .Release "Chart" .Chart) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "gophprofile.selectorLabels" (dict "component" .Values.server.name "Release" .Release "Chart" .Chart) | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "gophprofile.selectorLabels" (dict "component" .Values.worker.name "Release" .Release "Chart" .Chart) | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "gophprofile.selectorLabels" (dict "component" "migrate" "Release" .Release "Chart" .Chart) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
---
{{- end }}
{{- if .Values.rabbitmq.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gophprofile.fullname" . }}-rabbitmq
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gophprofile.selectorLabels" (dict "component" "rabbitmq" "Release" .Release "Chart" .Chart) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "gophprofile.selectorLabels" (dict "component" .Values.server.name "Release" .Release "Chart" .Chart) | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "gophprofile.selectorLabels" (dict "component" .Values.worker.name "Release" .Release "Chart" .Chart) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5672
---
{{- end }}
{{- if .Values.minio.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gophprofile.fullname" . }}-minio
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gophprofile.selectorLabels" (dict "component" "minio" "Release" .Release "Chart" .Chart) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "gophprofile.selectorLabels" (dict "component" .Values.server.name "Release" .Release "Chart" .Chart) | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "gophprofile.selectorLabels" (dict "component" .Values.worker.name "Release" .Release "Chart" .Chart) | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "gophprofile.selectorLabels" (dict "component" "minio-init" "Release" .Release "Chart" .Chart) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9000
{{- end }}
{{- end }}
