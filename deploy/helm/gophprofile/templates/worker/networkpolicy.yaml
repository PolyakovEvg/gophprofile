{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gophprofile.fullname" . }}-{{ .Values.worker.name }}
  labels:
    {{- include "gophprofile.componentLabels" (dict "component" .Values.worker.name "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gophprofile.selectorLabels" (dict "component" .Values.worker.name "Release" .Release "Chart" .Chart) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The worker has no public API; only Prometheus scrapes it.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.monitoringNamespaceLabel | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.worker.metricsPort }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "gophprofile.selectorLabels" (dict "component" "postgres" "Release" .Release "Chart" .Chart) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    {{- else }}
    - ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- if .Values.rabbitmq.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "gophprofile.selectorLabels" (dict "component" "rabbitmq" "Release" .Release "Chart" .Chart) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5672
    {{- else }}
    - ports:
        - protocol: TCP
          port: 5672
    {{- end }}
    {{- if .Values.minio.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "gophprofile.selectorLabels" (dict "component" "minio" "Release" .Release "Chart" .Chart) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9000
    {{- else }}
    - ports:
        - protocol: TCP
          port: 443
    {{- end }}
    - ports:
        - protocol: TCP
          port: 4317
{{- end }}
