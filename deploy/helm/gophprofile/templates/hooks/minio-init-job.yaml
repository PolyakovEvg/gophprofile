{{- if and .Values.migrationHook.enabled .Values.minio.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gophprofile.fullname" . }}-minio-init-{{ .Release.Revision }}
  labels:
    {{- include "gophprofile.componentLabels" (dict "component" "minio-init" "Release" .Release "Chart" .Chart) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrationHook.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrationHook.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "gophprofile.selectorLabels" (dict "component" "minio-init" "Release" .Release "Chart" .Chart) | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: minio-init
          image: {{ .Values.minio.mcImage }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_ENDPOINT
              value: "http://{{ include "gophprofile.fullname" . }}-minio:9000"
            - name: MINIO_BUCKET
              value: {{ .Values.minio.bucket | quote }}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: S3_SECRET_KEY
          command:
            - /bin/sh
            - -c
            - |
              set -e
              for i in $(seq 1 20); do
                if mc alias set local "$MINIO_ENDPOINT" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; then
                  break
                fi
                echo "waiting for minio..."
                sleep 3
              done
              mc mb "local/$MINIO_BUCKET" || true
              mc anonymous set download "local/$MINIO_BUCKET"
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
