{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gophprofile.serviceAccountName" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application never talks to the Kubernetes API, so it is granted no
# Role/RoleBinding (zero RBAC permissions) and does not mount its own token.
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
