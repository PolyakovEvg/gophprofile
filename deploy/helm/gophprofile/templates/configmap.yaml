apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gophprofile.configMapName" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
data:
  S3_REGION: {{ .Values.config.s3Region | quote }}
  S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  {{- if .Values.config.otelExporterEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterEndpoint | quote }}
  {{- end }}
  # Only read by the server; harmless (and unused) as an env var on the
  # worker, which has no HTTP API to rate limit.
  RATE_LIMIT_REQUESTS: {{ .Values.config.rateLimitRequests | quote }}
  RATE_LIMIT_WINDOW: {{ .Values.config.rateLimitWindow | quote }}
