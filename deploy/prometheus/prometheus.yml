global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: gophprofile-server
    static_configs:
      - targets: ["server:8080"]

  - job_name: gophprofile-worker
    static_configs:
      - targets: ["worker:9091"]
